{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "service.fullname" . }}
  labels: {{ include "service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{ $ingressContent := include "service.netpol.ingressRules" . | trim -}}
  {{- if $ingressContent }}
  ingress:
    {{ $ingressContent | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
  {{ $egressContent := include "service.netpol.egressRules" . | trim -}}
  {{- if $egressContent }}
  egress:
    {{ $egressContent | nindent 4 }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
