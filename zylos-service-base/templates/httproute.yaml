{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "service.fullname" . }}
  labels: {{ include "service.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentRef.name | default "zylos-edge-gateway" }}
      namespace: {{ .Values.httpRoute.parentRef.namespace | default "zylos-infra-gateway" }}
      {{- if .Values.httpRoute.parentRef.sectionName }}
      sectionName: {{ .Values.httpRoute.parentRef.sectionName }}
      {{- end }}
  {{- if .Values.httpRoute.hostnames }}
  hostnames:
    {{ toYaml .Values.httpRoute.hostnames | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.httpRoute.paths }}
    - matches:
        {{- range .Values.httpRoute.paths }}
        - path:
            type: {{ .type | default "PathPrefix" }}
            value: {{ .value }}
        {{- end }}
      backendRefs:
        - name: {{ include "service.fullname" . }}
          port: {{ .Values.service.httpPort | default 8080 }}
    {{- end }}
    {{- if .Values.httpRoute.extraRules }}
    {{ toYaml .Values.httpRoute.extraRules | nindent 4 }}
    {{- end }}
{{- end }}
