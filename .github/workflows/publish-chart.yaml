name: Publish Helm Chart to GHCR

on:
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

jobs:
  publish-chart:
    name: Package and Push OCI Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Authenticate to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Inject Version and Package Chart
        # Extract the version from the GitHub Release tag (e.g., 'v1.2.0' becomes '1.2.0')
        # Inject it dynamically into Chart.yaml before packaging.
        run: |
          # Get the tag from the GitHub event (e.g., v0.3.0)
          RELEASE_TAG="${{ github.event.release.tag_name }}"

          # Strip the leading 'v' to comply with strict SemVer for Helm (e.g., 0.3.0)
          SEMVER_VERSION="${RELEASE_TAG#v}"

          echo "Building Chart Version: ${SEMVER_VERSION}"

          # Use 'sed' to dynamically overwrite the version field in Chart.yaml
          sed -i "s/^version:.*/version: ${SEMVER_VERSION}/" Chart.yaml

          # Package the chart. It will use the newly injected version.
          helm package .

      - name: Push Chart to GHCR (OCI)
        run: |
          SEMVER_VERSION="${{ github.event.release.tag_name }}"
          SEMVER_VERSION="${SEMVER_VERSION#v}"

          helm push zylos-service-base-${SEMVER_VERSION}.tgz oci://ghcr.io/zylos-platform/charts
