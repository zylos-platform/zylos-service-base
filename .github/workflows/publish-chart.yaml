name: Publish Helm Chart to GHCR

on:
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

jobs:
  publish-chart:
    name: Package and Push OCI Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Authenticate to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Inject Version, Package, and Push
        run: |
          # Extract tag and strip the leading 'v'
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          SEMVER_VERSION="${RELEASE_TAG#v}"

          echo "Building Chart Version: ${SEMVER_VERSION}"

          # Corrected path: Inject version into the sub-directory Chart.yaml
          sed -i "s/^version:.*/version: ${SEMVER_VERSION}/" zylos-service-base/Chart.yaml

          # Package the chart
          helm package zylos-service-base

          # Safely format the organization name to lowercase for GHCR
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # Push the artifact using the variables already in scope
          helm push zylos-service-base-${SEMVER_VERSION}.tgz oci://ghcr.io/${REPO_OWNER}/charts
